name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore FrostyEditor
        run: dotnet msbuild FrostyEditor\FrostyEditor.csproj /t:Restore /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Build FrostyEditor
        run: msbuild FrostyEditor\FrostyEditor.csproj /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Restore FrostyCmd
        run: dotnet msbuild FrostyCmd\FrostyCmd.csproj /t:Restore /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Build FrostyCmd
        run: msbuild FrostyCmd\FrostyCmd.csproj /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64

      - name: Prepare plugin output folder
        run: New-Item -ItemType Directory -Force FrostyEditor\bin\Developer\Debug\Plugins

      - name: Restore CFB profile plugin
        run: dotnet msbuild Plugins\CFBProfilePlugin\CFBProfilePlugin.csproj /t:Restore /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\FrostyEditor\"

      - name: Build CFB profile plugin
        run: msbuild Plugins\CFBProfilePlugin\CFBProfilePlugin.csproj /p:Configuration="Developer - Debug" /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SolutionDir="$env:GITHUB_WORKSPACE\FrostyEditor\"

      - name: Package CFB profile plugin
        shell: pwsh
        run: |
          $plugin = Get-ChildItem Plugins\CFBProfilePlugin\bin -Recurse -Filter CFBProfilePlugin.dll |
            Select-Object -First 1
          if (-not $plugin) {
            throw "CFBProfilePlugin.dll was not produced."
          }

          $pluginDirectory = "FrostyEditor\bin\Developer\Debug\Plugins"
          New-Item -ItemType Directory -Force $pluginDirectory | Out-Null
          Copy-Item -LiteralPath $plugin.FullName -Destination $pluginDirectory -Force

          if (-not (Test-Path "$pluginDirectory\CFBProfilePlugin.dll")) {
            throw "CFBProfilePlugin.dll was not packaged beside FrostyEditor.exe."
          }

      - name: Upload editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostyEditor-Developer-Debug-x64
          path: FrostyEditor\bin\Developer\Debug\
          if-no-files-found: error

      - name: Upload command exporter artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrostyCmd-Developer-Debug-x64
          path: FrostyEditor\bin\Developer\Debug\
          if-no-files-found: error
